name: Release

# Publish a new version by pushing a tag such as v1.2.0 (or 1.2.0), or by
# creating a release with such a tag from the GitHub website.
# The app checks GitHub Releases and offers the update automatically.
on:
  push:
    tags: ["v*", "[0-9]*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See docs/SVILUPPO.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MYIPTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MYIPTV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYIPTV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYIPTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "myIPTV-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: myIPTV-${{ steps.version.outputs.name }}.apk
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release (possibly a draft) already exists for this tag: attach the APK and publish it.
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" "$APK" --title "myIPTV ${{ steps.version.outputs.name }}" --generate-notes --latest
          fi
