name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --continue 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/Gradle errors as annotations (readable without the raw log).
          grep -E '^e: |error:|What went wrong|^> |FAILED|Could not' build.log | head -n 80 > errors.txt || true
          split -l 20 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=Build errors::$msg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: myIPTV-debug
          path: app/build/outputs/apk/debug/*.apk
